# =============================================================================
#  Producción (EC2): PostgreSQL + migraciones + orquestador + dashboard + archivado S3
#
#    cd deployment
#    cp .env.production.example .env.production   # o generado desde SSM por aws/user_data.sh
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
#  Arranque ordenado: postgres (healthy) -> migrate (completado OK) -> orchestrator / dashboard / shipper
#  Endurecimiento: rootfs de solo lectura, sin privilegios nuevos, capabilities eliminadas,
#  límites de CPU/memoria, logs rotados, puertos solo en loopback (exponer vía ALB/SSM/túnel).
# =============================================================================
name: risk-engine-prod

x-app-common: &app-common
  env_file: .env.production
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-engine-image: &engine-image
  image: ${REGISTRY:-local}/risk-engine:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    target: engine
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - synchronous_commit=on
      - -c
      - deadlock_timeout=200ms
      - -c
      - log_lock_waits=on
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - log_min_duration_statement=250
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  migrate:
    <<: [*app-common, *engine-image]
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  orchestrator:
    <<: [*app-common, *engine-image]
    command: ["orchestrator"]
    environment:
      SERVICE_ROLE: orchestrator
      LOG_FILE: /var/log/risk-engine/orchestrator.log
    volumes:
      - logs:/var/log/risk-engine
    stop_grace_period: 30s          # SIGTERM -> barrido final de liquidaciones + mark_offline
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  dashboard:
    <<: *app-common
    image: ${REGISTRY:-local}/risk-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: dashboard
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    command: ["dashboard"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  log-shipper:
    <<: [*app-common, *engine-image]
    command: ["shipper"]
    environment:
      SERVICE_ROLE: shipper
      LOG_DIR: /var/log/risk-engine
    volumes:
      - logs:/var/log/risk-engine
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

volumes:
  pgdata:
    name: risk_engine_prod_pgdata
  logs:
    name: risk_engine_prod_logs

networks:
  backend:
    name: risk_engine_backend
    driver: bridge
